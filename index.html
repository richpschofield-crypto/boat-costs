<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boat Costs</title>
<meta name="theme-color" content="#1f4e6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boat Costs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f2f4f6; --card: #ffffff; --ink: #16212b; --muted: #5d6975; --faint: #8a949e;
  --line: #e1e5e9; --accent: #1f4e6b; --accent-2: #2c6a8f; --accent-soft: #e3edf3;
  --on-accent: #ffffff; --est: #9a5a14; --est-soft: #fbf0e1; --danger: #b3261e;
  --ok: #2e7d4f; --shadow: 0 1px 2px rgba(16,33,43,.06), 0 2px 8px rgba(16,33,43,.05);
  --radius: 14px;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f161c; --card: #172129; --ink: #e8edf1; --muted: #a2adb7; --faint: #75818c;
    --line: #26323c; --accent: #5fa3cc; --accent-2: #7cb6d8; --accent-soft: #1b2e3b;
    --on-accent: #0c1a24; --est: #e0a45e; --est-soft: #2d2216; --danger: #ef8a83; --ok: #74c69d;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 5; background: var(--accent); color: var(--on-accent);
  padding: calc(var(--safe-top) + 10px) 16px 12px;
}
.top-row { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: .2px; }
.pill {
  border: 0; border-radius: 999px; padding: 5px 10px; font-size: 13px;
  background: rgba(255,255,255,.16); color: inherit; display: inline-flex; align-items: center; gap: 6px;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #9fe0b8; }
.pill.wait .dot { background: #ffd28a; }
.pill.off .dot { background: #c9d2da; }
.pill.bad .dot { background: #ff9a92; }
.icon-btn { border: 0; background: transparent; color: inherit; padding: 6px; border-radius: 10px; display: grid; place-items: center; }
.icon-btn svg { width: 24px; height: 24px; }
.search-row { display: flex; gap: 8px; margin-top: 10px; }
.search {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.16);
  border-radius: 12px; padding: 0 10px;
}
.search svg { width: 18px; height: 18px; opacity: .8; flex: none; }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: inherit; padding: 10px 0; outline: none;
}
.search input::placeholder { color: inherit; opacity: .7; }
.filter-btn { flex: none; border: 0; border-radius: 12px; padding: 0 12px; background: rgba(255,255,255,.16); color: inherit; display: flex; align-items: center; gap: 6px; }
.filter-btn.on { background: var(--on-accent); color: var(--accent); }
.filter-btn svg { width: 18px; height: 18px; }
@media (prefers-color-scheme: dark) {
  .top { background: #14222d; color: var(--ink); }
  .filter-btn.on { background: var(--accent); color: var(--on-accent); }
}

/* ---------- list ---------- */
main { padding: 12px 16px calc(var(--safe-bottom) + 96px); max-width: 720px; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip b { font-weight: 600; }
.chip button { border: 0; background: transparent; padding: 0 0 0 2px; color: var(--muted); font-size: 15px; line-height: 1; }
.summary { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 14px; margin: 2px 2px 12px; }
.summary strong { color: var(--ink); font-size: 17px; }
.month { margin: 18px 2px 6px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.month:first-of-type { margin-top: 4px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 0; width: 100%; text-align: left; background: transparent; }
.row + .row { border-top: 1px solid var(--line); }
.row:active { background: var(--accent-soft); }
.date-badge { flex: none; width: 42px; text-align: center; line-height: 1.05; color: var(--muted); }
.date-badge .d { font-size: 19px; font-weight: 600; color: var(--ink); }
.date-badge .w { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.row-sub svg { width: 13px; height: 13px; flex: none; }
.row-amt { text-align: right; flex: none; }
.row-amt .a { font-weight: 600; }
.row-amt .who { font-size: 12px; color: var(--faint); }
.tag-est { font-size: 11px; font-weight: 600; color: var(--est); background: var(--est-soft); border-radius: 6px; padding: 1px 5px; }
.tag-wait { color: var(--est); }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty h2 { color: var(--ink); font-size: 18px; margin: 0 0 6px; }

.fab {
  position: fixed; right: 18px; bottom: calc(var(--safe-bottom) + 18px); z-index: 6;
  border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  padding: 15px 22px 15px 18px; font-weight: 600; font-size: 17px; display: flex; gap: 8px; align-items: center;
  box-shadow: 0 6px 18px rgba(16,33,43,.28);
}
.fab svg { width: 22px; height: 22px; }

/* ---------- sheets ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
  animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head {
  display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-top) + 10px) 8px 10px;
  background: var(--card); border-bottom: 1px solid var(--line);
}
.sheet-head h2 { flex: 1; margin: 0; font-size: 17px; text-align: center; }
.text-btn { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 8px 10px; border-radius: 10px; min-width: 72px; }
.text-btn.left { text-align: left; font-weight: 400; }
.text-btn.right { text-align: right; }
.text-btn:disabled { opacity: .4; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(var(--safe-bottom) + 32px); }
.sheet-body > * { max-width: 640px; margin-left: auto; margin-right: auto; }

.group { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
.group-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 0 4px 6px; font-weight: 600; }
.field { display: flex; flex-direction: column; padding: 10px 14px; }
.field + .field, .field + .toggle, .toggle + .field { border-top: 1px solid var(--line); }
.field label { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.field input, .field select, .field textarea {
  min-width: 0; border: 0; background: transparent; padding: 4px 0; outline: none; width: 100%; font-size: 17px;
  -webkit-appearance: none; appearance: none; min-height: 30px;
}
.field select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 12px) 55%, calc(100% - 7px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 24px; }
.field textarea { resize: vertical; min-height: 64px; }
.money { display: flex; align-items: center; gap: 4px; }
.money span { font-size: 17px; color: var(--muted); }
.field.err label { color: var(--danger); }
.toggle { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.toggle .t-text { flex: 1; }
.toggle .t-text small { display: block; color: var(--muted); font-size: 13px; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .15s; }
.switch input:checked + span { background: var(--est); }
.switch input:checked + span::after { transform: translateX(20px); }

.photos { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 14px; }
.thumb { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; background: var(--accent-soft); border: 0; padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 24px; padding: 0; }
.thumb .ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--muted); font-size: 12px; }
.add-photo { width: 84px; height: 84px; border-radius: 10px; border: 1.5px dashed var(--faint); background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; }
.add-photo svg { width: 24px; height: 24px; }

.meta-line { color: var(--muted); font-size: 13px; text-align: center; margin: 4px 0 16px; }
.btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-weight: 600; font-size: 17px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); background: var(--card); }
.btn.plain { background: var(--card); color: var(--accent); }
.btn + .btn { margin-top: 10px; }
.form-error { color: var(--danger); text-align: center; margin: 0 0 12px; font-size: 15px; }

.list-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.list-item + .list-item { border-top: 1px solid var(--line); }
.list-item .li-main { flex: 1; min-width: 0; }
.list-item .li-main small { color: var(--muted); display: block; font-size: 13px; }
.list-item input[type=text] { flex: 1; border: 0; background: transparent; outline: none; font-size: 17px; padding: 4px 0; min-width: 0; }
.mini { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 9px; padding: 6px 10px; font-size: 14px; font-weight: 600; }
.mini.muted { color: var(--muted); font-weight: 400; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; }
.quick button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.quick button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---------- lock screen ---------- */
.lock {
  position: fixed; inset: 0; z-index: 50; background: var(--accent); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(var(--safe-top) + 24px) 24px calc(var(--safe-bottom) + 24px);
}
@media (prefers-color-scheme: dark) { .lock { background: #14222d; color: var(--ink); } }
.lock-logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 14px; }
.lock h2 { margin: 0 0 4px; font-size: 22px; }
.lock p { margin: 0; opacity: .85; text-align: center; min-height: 22px; }
.lock .msg { color: #ffd3cf; min-height: 22px; margin-top: 6px; font-size: 15px; text-align: center; }
.dots { display: flex; gap: 14px; margin: 26px 0 30px; min-height: 16px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; opacity: .9; }
.dots i.f { background: currentColor; }
.dots.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
.pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 24px; }
.pad button {
  width: 76px; height: 76px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: inherit;
  font-size: 30px; font-weight: 400;
}
.pad button:active { background: rgba(255,255,255,.34); }
.pad button.ghost { background: transparent; font-size: 16px; }
.pad button:disabled { opacity: .35; }
.lock-actions { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lock-actions button { border: 0; background: transparent; color: inherit; opacity: .85; font-size: 15px; padding: 6px 10px; }
.lock-actions .go { background: #fff; color: var(--accent); opacity: 1; font-weight: 600; border-radius: 999px; padding: 12px 34px; font-size: 17px; }
@media (prefers-color-scheme: dark) { .lock-actions .go { background: var(--accent); color: var(--on-accent); } }

/* ---------- view switch ---------- */
.tabs { display: flex; gap: 4px; margin-top: 10px; background: rgba(255,255,255,.12); border-radius: 12px; padding: 3px; max-width: 440px; }
.tabs button { position: relative; white-space: nowrap; }
.tab-badge { position: absolute; top: -5px; right: -2px; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; background: var(--late); color: #fff; font-size: 11px; font-weight: 700; padding: 0 5px; box-shadow: 0 0 0 2px var(--accent); }
@media (prefers-color-scheme: dark) { .tab-badge { color: #1a0d0c; box-shadow: 0 0 0 2px #14222d; } }
.tabs button { flex: 1; border: 0; background: transparent; color: inherit; padding: 7px 10px; border-radius: 9px; font-weight: 600; font-size: 15px; opacity: .85; }
.tabs button.on { background: var(--on-accent); color: var(--accent); opacity: 1; }
@media (prefers-color-scheme: dark) { .tabs button.on { background: var(--accent); color: var(--on-accent); } }
.btn:disabled { opacity: .45; }

/* ---------- dashboard ---------- */
:root { --bar: #1f4e6b; --bar-prev: #a7c0d3; --hl: rgba(31,78,107,.07); }
@media (prefers-color-scheme: dark) { :root { --bar: #6aaed6; --bar-prev: #36586f; --hl: rgba(255,255,255,.06); } }
.dash { max-width: 1180px; padding-bottom: calc(var(--safe-bottom) + 40px); }
.dash-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 14px; }
.year-pick { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.year-pick select { font-size: 17px; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 30px 6px 12px; -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
.t-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.t-value { font-size: 22px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.hero .t-value { font-size: 28px; color: var(--accent); }
.t-note { font-size: 13px; color: var(--muted); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head h3 { margin: 0; font-size: 16px; }
.panel-sub { color: var(--muted); font-size: 13px; }
.panel-foot { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
.muted-note { color: var(--muted); margin: 6px 0; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.sw.cur { background: var(--bar); }
.sw.prev { background: var(--bar-prev); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; touch-action: manipulation; }
.chart .b-cur { fill: var(--bar); }
.chart .b-prev { fill: var(--bar-prev); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--faint); stroke-width: 1; }
.chart .tick, .chart .mlabel { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .mlabel.future { fill: var(--faint); opacity: .6; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .col-hl { fill: var(--hl); }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; z-index: 2; }
.tip-h { font-weight: 700; margin-bottom: 4px; }
.tip div { display: flex; align-items: center; gap: 6px; }
.tip b { margin-left: auto; padding-left: 12px; font-weight: 600; }
.cat-bars { display: flex; flex-direction: column; }
.cat-row { display: grid; grid-template-columns: minmax(80px, 34%) minmax(0, 1fr) auto 38px; align-items: center; gap: 10px; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; text-align: left; width: 100%; }
.cat-row:hover, .top-row:hover, .cell-btn:hover { background: var(--hl); }
.cat-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-track { height: 12px; border-radius: 0 4px 4px 0; position: relative; }
.cat-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; }
.cat-val { font-size: 14px; font-weight: 600; text-align: right; }
.cat-pct { font-size: 13px; color: var(--muted); text-align: right; }
.top-list { display: flex; flex-direction: column; }
.top-row { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; text-align: left; width: 100%; }
.top-row + .top-row { border-top: 1px solid var(--line); border-radius: 0; }
.top-rank { width: 20px; color: var(--faint); font-size: 13px; text-align: right; flex: none; }
.top-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-amt { font-weight: 600; flex: none; }
.firm-line { margin: 0 0 10px; font-size: 15px; }
.firm-track { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.firm-track span { display: block; height: 100%; background: var(--est); border-radius: 6px; }
.firm-note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
.yoy { border-collapse: collapse; width: 100%; font-size: 14px; }
.yoy th, .yoy td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.yoy thead th { color: var(--muted); font-weight: 600; font-size: 13px; text-align: left; }
.yoy th.num, .yoy td.num { text-align: right; }
.yoy tbody th { text-align: left; font-weight: 500; }
.yoy tfoot th, .yoy tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line); }
.yoy tfoot th { text-align: left; }
.yoy .sel { background: var(--hl); }
.yoy .dim { color: var(--faint); }
.yoy .strong { font-weight: 600; }
.cell-btn { border: 0; background: transparent; padding: 2px 4px; margin: -2px -4px; border-radius: 6px; font: inherit; color: inherit; font-variant-numeric: tabular-nums; }
.est-dot { color: var(--est); font-weight: 700; margin-left: 2px; }
@media (min-width: 760px) {
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dash-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span-wide, .span-full { grid-column: 1 / -1; }
}
@media (min-width: 1100px) {
  .dash-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .span-wide { grid-column: span 2; }
  .dash-grid .panel:nth-child(2) { grid-row: span 2; }
}

/* ---------- photo viewer / toast ---------- */
.viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; align-items: center; justify-content: center; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer.pdf { flex-direction: column; background: #1b1f23; }
.viewer.pdf iframe { flex: 1; width: 100%; border: 0; background: #fff; margin-top: calc(var(--safe-top) + 56px); }
.pdf-bar { position: absolute; top: calc(var(--safe-top) + 10px); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 10px; }
.pdf-bar .pdf-open, .pdf-bar .pdf-close { position: static; border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 16px; text-decoration: none; }
.pdf-thumb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--accent); font-weight: 700; font-size: 13px; }
.pdf-thumb svg { width: 28px; height: 28px; }
.pdf-thumb small { color: var(--muted); font-weight: 400; font-size: 11px; }
.viewer button { position: absolute; top: calc(var(--safe-top) + 10px); right: 12px; border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 16px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-bottom) + 90px); z-index: 60;
  background: #16212b; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 32px);
  box-shadow: 0 6px 18px rgba(0,0,0,.25); animation: up .18s ease-out;
}

/* ---------- reminders ---------- */
:root { --late: #b3261e; --late-soft: #fbe7e5; --soon: #9a5a14; --soon-soft: #fbf0e1; }
@media (prefers-color-scheme: dark) { :root { --late: #ef8a83; --late-soft: #3a1c1a; --soon: #e0a45e; --soon-soft: #2d2216; } }
.due-strip { margin: 0 0 14px; }
.due-strip .strip-head { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 2px 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.due-strip .strip-head button { border: 0; background: transparent; color: var(--accent); font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; padding: 0; }
.rem-icon { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.rem-icon svg { width: 20px; height: 20px; }
.rem-icon.late { background: var(--late-soft); color: var(--late); }
.rem-icon.soon { background: var(--soon-soft); color: var(--soon); }
.rem-icon.done { background: var(--bg); color: var(--ok); }
.due-txt { font-size: 13px; font-weight: 600; white-space: nowrap; }
.due-txt.late { color: var(--late); }
.due-txt.soon { color: var(--soon); }
.due-txt.later { color: var(--muted); font-weight: 400; }
.row.is-late .row-title { color: var(--late); }
.row.done-row .row-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.sec-title { margin: 18px 2px 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; display: flex; justify-content: space-between; }
.sec-title:first-child { margin-top: 4px; }
.sec-title.late { color: var(--late); }
.seg { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 3px; margin: 10px 14px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.every { display: flex; align-items: center; gap: 10px; }
.every input { width: 70px !important; flex: none !important; text-align: center; border: 1px solid var(--line) !important; border-radius: 9px; padding: 6px 4px !important; background: var(--bg) !important; }
.hint { color: var(--muted); font-size: 13px; padding: 0 14px 12px; margin: -4px 0 0; }
.btn.done-btn { background: var(--ok); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.done-btn { color: #0c1a24; } }
.rp-ico { display: inline-flex; color: var(--accent); }
.field input:disabled, .field select:disabled, .field textarea:disabled { color: var(--muted); }
.note-box { background: var(--card); border-radius: var(--radius); padding: 12px 14px; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
</style>
</head>
